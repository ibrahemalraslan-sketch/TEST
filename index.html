<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بنك اختبارات كلية الطب البشري</title>

  <!-- مكتبات Firebase الرسمية لحماية الصفحة والتحقق من الجلسة -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Tajawal', 'Cairo', 'sans-serif'] },
          colors: {
            brand: { 50:'#f0f9ff',100:'#e0f2fe',500:'#0284c7',600:'#0369a1',700:'#075985',800:'#0c4a6e',900:'#082f49' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family:'Tajawal', sans-serif; background:#f8fafc; color:#0f172a; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="min-h-screen text-slate-800 antialiased">

  <header class="bg-white/95 backdrop-blur-md border-b border-sky-100 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg sm:text-xl font-black text-sky-950">بنك اختبارات كلية الطب البشري</h1>
        <p class="text-xs text-slate-500 mt-0.5">اختر سنتك الدراسية للبدء بالاختبارات</p>
      </div>
      <button onclick="logout()" class="text-xs bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 font-bold px-3 py-1.5 rounded-lg border border-slate-200 transition">
        تسجيل الخروج
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6">
    <section id="overall-summary" class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm mb-5 text-sm">
      <div class="flex items-center justify-between">
        <span class="font-bold text-slate-700">تقدمك الإجمالي</span>
        <span id="overall-count" class="font-black text-sky-700">0 / 0</span>
      </div>
      <div class="mt-2" id="overall-bar"></div>
    </section>

    <div id="years-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
      <!-- تُملأ عبر JS -->
    </div>

    <p id="empty-state" class="hidden text-center text-slate-400 text-sm py-10">تعذر تحميل بيانات السنوات.</p>
  </main>

  <footer class="max-w-4xl mx-auto px-4 py-6 text-center text-[11px] text-slate-400">
    موقع بسيط لتتبع اختبارات كلية الطب — تقدمك محفوظ محلياً على متصفحك فقط.
  </footer>

  <script src="assets/site.js"></script>
  <script>
    async function boot() {
      let curriculum;
      try {
        curriculum = await loadCurriculum();
      } catch (e) {
        document.getElementById('empty-state').classList.remove('hidden');
        return;
      }

      const grid = document.getElementById('years-grid');
      let totalAll = 0, completedAll = 0;

      curriculum.years.forEach(year => {
        const stats = yearStats(year);
        totalAll += stats.totalExams;
        completedAll += stats.completedExams;

        const card = document.createElement('a');
        card.href = `year.html?year=${year.id}`;
        card.className = 'bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm hover:shadow-md hover:border-sky-300 transition flex flex-col gap-2';
        card.innerHTML = `
          <div class="w-9 h-9 rounded-xl bg-sky-50 border border-sky-100 flex items-center justify-center text-sky-700 font-black">${year.id}</div>
          <div>
            <h2 class="font-extrabold text-sm text-slate-900">${escapeHtml(year.name)}</h2>
            <p class="text-[11px] text-slate-400 mt-0.5">${stats.totalExams > 0 ? `${stats.completedExams} / ${stats.totalExams} اختبار مكتمل` : 'لا توجد اختبارات مضافة بعد'}</p>
          </div>
          ${stats.totalExams > 0 ? progressBarHtml(stats.completedExams, stats.totalExams) : ''}
        `;
        grid.appendChild(card);
      });

      document.getElementById('overall-count').innerText = `${completedAll} / ${totalAll}`;
      document.getElementById('overall-bar').innerHTML = progressBarHtml(completedAll, totalAll);
    }

    boot();
  </script>
</body>
</html>
